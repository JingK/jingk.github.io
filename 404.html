<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <!-- Styles are inline on purpose: this page can be shown at any URL depth,
       so a relative link to styles.css could point to the wrong place. -->
  <style>
    :root {
      --bg: #fbfaf8;
      --text: #1c1b1a;
      --muted: #5c5955;
      --accent: #2f5bd3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141414;
        --text: #ecebe8;
        --muted: #a9a59f;
        --accent: #8fb0ff;
      }
    }
    body {
      box-sizing: border-box;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      text-align: center;
    }
    h1 { font-size: 2rem; margin: 0 0 0.5rem; }
    p { margin: 0 0 1rem; color: var(--muted); }
    a { color: var(--accent); font-weight: 600; text-underline-offset: 0.2em; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>Sorry, there's nothing at this address.</p>
    <a href="/">Go to the home page</a>
  </main>
</body>
</html>
